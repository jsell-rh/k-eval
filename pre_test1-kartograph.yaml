name: "pre_test1-kartograph"
version: "1"

dataset:
  path: "./test1.jsonl"
  question_key: "question"
  answer_key: "answer"

agent:
  type: "claude_code_sdk"
  model: "claude-sonnet-4-5"

judge:
  model: "vertex_ai/claude-opus-4-5"
  temperature: 0.0

mcp_servers:
  graph:
    type: "http"
    url: "http://localhost:8000/query/mcp"
    headers:
      X-API-Key: "${KARTOGRAPH_MCP_API_KEY}"
      x-gitlab-pat: "${ASK_SRE_DATA_SOURCES_GITLAB_PAT}"

conditions:
  kartograph:
    mcp_servers: [graph]
    system_prompt_file: "kartograph_system_prompt.md"
    # Set to true once Kartograph MCP is returning success; leave false to get a completed run and inspect tool_error in results.
    require_mcp_tool_use: true
    require_mcp_tool_success: false

execution:
  num_repetitions: 1
  max_concurrent: 1
  retry:
    max_attempts: 2
    initial_backoff_seconds: 1
    backoff_multiplier: 2
